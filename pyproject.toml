[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crop-species-detection"
version = "0.1.0"
description = "Hierarchical crop species classification (cropland detection + species) using a DINOv2 ViT-B/14 backbone."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "See LICENSE / upstream DINOv2 & dataset terms" }
authors = [
    { name = "Diego Caparros Vaquer" }
]
keywords = ["crop", "classification", "dinov2", "agriculture", "pytorch", "computer-vision"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "timm>=1.0.19",
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "Pillow>=11.1.0",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.10.0"]
dev = ["pytest", "build", "twine"]

[project.scripts]
crop-species-detect = "crop_species_detection.cli:main"

[project.urls]
Homepage = "https://github.com/diegocaparrosvaquer/crop-species-detection-demo"
Repository = "https://github.com/diegocaparrosvaquer/crop-species-detection-demo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"crop_species_detection" = ["py.typed"]
